# for the T3 robustness-delta gate.

experiment:
  name: baseline_qwen_smoke
  phase: "1"
  seeds: [0]
  output_dir: /home/medadmin/kosmasapostolidis/adversarial-reasoning-training/runs/baseline_qwen

  models:
    - qwen2_5_vl_7b

  tasks:
    - prostate_mri_workup

  task_overrides:
    prostate_mri_workup:
      dataset_split:
        dev: 5

  attacks:
    - pgd_linf

  attack_overrides:
    pgd_linf:
      epsilons: [0.0314]
      steps: [20]
      random_restarts: [1]
