# Robust-eval smoke against DEFENDED Qwen2.5-VL-7B (epoch-1 adv-FT, TRADES β=6.0, ε=2/255).
# Same eval matrix as baseline_qwen_smoke.yaml so records can be paired by
# (sample_id, epsilon, attack_mode, seed).

experiment:
  name: defended_qwen_smoke
  phase: "1"
  seeds: [0]
  output_dir: /home/medadmin/kosmasapostolidis/adversarial-reasoning-training/runs/adv1_qwen/eval

  models:
    - defended_qwen2_5_vl_7b

  tasks:
    - prostate_mri_workup

  task_overrides:
    prostate_mri_workup:
      dataset_split:
        dev: 5

  attacks:
    - pgd_linf

  attack_overrides:
    pgd_linf:
      epsilons: [0.0314]
      steps: [20]
      random_restarts: [1]
