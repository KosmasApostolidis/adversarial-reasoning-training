# Ablation: epsilon schedule — reverse curriculum 8/255 → 4/255 → 2/255.
# Pass via `--defenses configs/ablations/defenses_eps_reverse.yaml`.

_extends: _defenses_eps_common.yaml

pgd:
  eps_schedule:
    - {epoch_range: [1, 5], eps: 0.0314}    # 8/255 — strongest first
    - {epoch_range: [6, 6], eps: 0.0157}    # 4/255
    - {epoch_range: [7, 8], eps: 0.0078}    # 2/255 — weakest last
  default_eps: 0.0157
  alpha_ratio: 0.25
  steps: 7
  refresh_K: 1
  eval_eps: [0.0157, 0.0314]
  eval_steps: 40
