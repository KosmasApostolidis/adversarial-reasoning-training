# Ablation: epsilon schedule — reverse curriculum 8/255 → 4/255 → 2/255.
# Pass via `--defenses configs/ablations/defenses_eps_reverse.yaml`.

_extends: _defenses_eps_common.yaml

pgd:
  eps_schedule:
    - {epoch_range: [1, 10],  eps: 0.0628}   # 16/255 — strongest first
    - {epoch_range: [11, 20], eps: 0.0628}   # 16/255 — hold
    - {epoch_range: [21, 30], eps: 0.0314}   # 8/255
    - {epoch_range: [31, 50], eps: 0.0157}   # 4/255
    - {epoch_range: [51, 64], eps: 0.0078}   # 2/255 — weakest last
  default_eps: 0.0157
  alpha_ratio: 0.25
  steps: 7
  refresh_K: 1
  eval_eps: [0.0157, 0.0314]
  eval_steps: 40
