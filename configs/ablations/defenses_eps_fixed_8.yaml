# Ablation: epsilon schedule — constant 8/255, no curriculum.
#
# Diff vs configs/defenses.yaml: pgd.eps_schedule collapsed to one entry
# spanning all epochs at eps = 8/255 (0.0314). default_eps matched.
# Tests whether the OAAT-style ramp matters or if the model can absorb
# the strongest budget from epoch 1.
# Pass via `--defenses configs/ablations/defenses_eps_fixed_8.yaml`.

pgd:
  eps_schedule:
    - {epoch_range: [1, 5], eps: 0.0314}    # 8/255 throughout
  default_eps: 0.0314
  alpha_ratio: 0.25
  steps: 7
  refresh_K: 1
  eval_eps: [0.0157, 0.0314]
  eval_steps: 40

trades:
  beta_start: 6.0
  beta_end: 3.0
  temperature: 2.0

pgd_at:
  # no extra knobs

oaat:
  alpha: 0.5
