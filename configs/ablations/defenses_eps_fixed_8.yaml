# Ablation: epsilon schedule — constant 8/255, no curriculum.
# Pass via `--defenses configs/ablations/defenses_eps_fixed_8.yaml`.

_extends: _defenses_eps_common.yaml

pgd:
  eps_schedule:
    - {epoch_range: [1, 8], eps: 0.0314}    # 8/255 throughout
  default_eps: 0.0314
  alpha_ratio: 0.25
  steps: 7
  refresh_K: 1
  eval_eps: [0.0157, 0.0314]
  eval_steps: 40
