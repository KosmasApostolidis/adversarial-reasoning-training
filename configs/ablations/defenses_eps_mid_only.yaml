# Ablation: epsilon schedule — constant 4/255 (mid budget, no curriculum).
# Pass via `--defenses configs/ablations/defenses_eps_mid_only.yaml`.

_extends: _defenses_eps_common.yaml

pgd:
  eps_schedule:
    - {epoch_range: [1, 8], eps: 0.0157}    # 4/255 throughout
  default_eps: 0.0157
  alpha_ratio: 0.25
  steps: 7
  refresh_K: 1
  eval_eps: [0.0157, 0.0314]
  eval_steps: 40
