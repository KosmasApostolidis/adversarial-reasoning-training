# Gold-trajectory cache configuration.
#
# Bumping oracle_version invalidates all cache keys (gold_cache_key
# hashes the version into the filename), forcing a re-generate.

oracle_version: v1
cache_dir: data/gold

# NOTE: expert_probe path and threshold are consumed by T1 CLI flags
# (--expert-probe, --expert-probe-min-acc), NOT read from this file.
# These keys are documentation-only; changing them here has no effect.
expert_probe: data/gold/expert_probe.jsonl
expert_probe_min_acc: 0.85

# NOTE: ``templates.enabled`` is documentation-only.  All five templates
# are always active in code (gold/templates.py).  Removing an entry here
# does not disable the template.
templates:
  enabled:
    - pirads_1_2
    - pirads_3
    - pirads_4
    - pirads_5
    - post_treatment
