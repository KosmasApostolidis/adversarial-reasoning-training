# Gold-trajectory cache configuration.
#
# Bumping oracle_version invalidates all cache keys (gold_cache_key
# hashes the version into the filename), forcing a re-generate.

oracle_version: v1
cache_dir: data/gold

# NOTE: expert_probe paths and thresholds are configured at the gate level
# (T1 CLI flags), not read from this file. The template list below is also
# advisory — all five templates are always enabled in code.
expert_probe: data/gold/expert_probe.jsonl
expert_probe_min_acc: 0.85

templates:
  enabled:
    - pirads_1_2
    - pirads_3
    - pirads_4
    - pirads_5
    - post_treatment
